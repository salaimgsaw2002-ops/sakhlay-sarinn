<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>စက်လှေ ငွေစာရင်း</title>

<style>
body{
    font-family: sans-serif;
    background:#f2f2f2;
    padding:20px;
}
.box{
    background:white;
    padding:15px;
    border-radius:10px;
    max-width:450px;
    margin:auto;
}
h2{
    text-align:center;
    color:#0b5ed7;
}
input,select,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    font-size:16px;
}
button{
    background:#0b5ed7;
    color:white;
    border:none;
    border-radius:5px;
}
.result{
    margin-top:20px;
    background:#eef6ff;
    padding:10px;
    border-radius:5px;
}
</style>

</head>

<body>

<div class="box">

<h2>🚤 စက်လှေ ငွေစာရင်း</h2>

<label>စက်လှေ</label>
<select id="boat">
<option>စက်လှေ (၁)</option>
<option>စက်လှေ (၂)</option>
<option>စက်လှေ (၃)</option>
</select>

<label>ခေါက်ရေ</label>
<input type="number" id="trip" value="1">

<label>ရာသီ</label>
<select id="season">
<option value="700000">မိုးရာသီ</option>
<option value="400000">နွေ/ဆောင်း</option>
</select>

<label>အသုံးစရိတ်</label>
<input type="number" id="cost" value="0">

<button onclick="calc()">တွက်မည်</button>

<div class="result" id="show">
အမြတ်ပေါ်လာပါမည်...
</div>

</div>

<script>

function calc(){

let trip=Number(document.getElementById("trip").value);

let price=Number(document.getElementById("season").value);

let cost=Number(document.getElementById("cost").value);

let income=trip*price;

let profit=income-cost;

document.getElementById("show").innerHTML=

"💰 ဝင်ငွေ = "+income.toLocaleString()+" ကျပ်<br><br>"+

"💸 အသုံးစရိတ် = "+cost.toLocaleString()+" ကျပ်<br><br>"+

"✅ အမြတ် = "+profit.toLocaleString()+" ကျပ်";

}

</script>

</body>
</html>
